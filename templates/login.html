<!DOCTYPE html>
<html>

<head>

    <title>Customer Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
        }

    </style>

</head>

<body>

<header>

    <h1>Supermarket Sales Analysis</h1>

    <p>Customer Login</p>

</header>


<div class="container">

    <h2>Login</h2>

    <form method="POST" action="/login">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    {% if message %}

    <div class="message">

        {{ message }}

    </div>

    {% endif %}


    <div class="register-link">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>


    <a href="/" class="home-link">
        ← Back to Home
    </a>

</div>

</body>

</html>

<!DOCTYPE html>
<html>

<head>

    <title>Order Confirmation</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 60%;
            margin: 60px auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .success {
            font-size: 60px;
        }

        h2 {
            color: #27ae60;
        }

        .order-info {
            margin-top: 25px;
            line-height: 2;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin: 15px;
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .home {
            background-color: #7f8c8d;
        }

    </style>

</head>

<body>

<header>

    <h1>Supermarket Sales Analysis</h1>

    <p>Order Confirmation</p>

</header>


<div class="container">

    <div class="success">
        ✅
    </div>

    <h2>
        Order Placed Successfully!
    </h2>

    <p>
        Thank you for shopping with us.
    </p>


    <div class="order-info">

        <strong>Order ID:</strong>
        #{{ order_id }}

        <br>

        <strong>Total Amount:</strong>
        ₹{{ "%.2f"|format(total_amount) }}

        <br>

        <strong>Payment Method:</strong>
        {{ payment_method }}

        <br>

        <strong>Order Status:</strong>
        Placed

    </div>


    <a href="/products" class="button">
        Continue Shopping
    </a>


    <a href="/" class="button home">
        Back to Home
    </a>

</div>

</body>

</html>
